# Build the solver and run the ctest suite on Linux and macOS.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu (GCC)
            os: ubuntu-latest
          - name: macOS (AppleClang + libomp)
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libeigen3-dev libgsl-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake eigen gsl libomp

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python requirements
        run: python -m pip install -r initial_states/requirements.txt

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j 4

      - name: Run tests
        run: ctest --test-dir build -j 2 --output-on-failure --timeout 1200
        env:
          OMP_NUM_THREADS: 2
